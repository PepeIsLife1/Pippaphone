; Firmware della tastiera (ESP32-C3) del T-Deck per il Pippaphone. Stessa piattaforma e scheda del firmware
; LilyGO (platformio.ini del repository Xinyuan-LilyGO/T-Deck, ambiente T-Keyboard): Arduino 2.0.17.
;   pio run                         compila
;   pio run -t upload --upload-port /dev/ttyUSB0      carica (adattatore USB-seriale, vedi LEGGIMI.md)
; La pagina per caricare dal browser (strumenti/flasher/prepara.py) compila questo stesso ambiente e prende i file
; da .pio/build/tastiera/flasher_args.json, che scrive scrivi_flasher_args.py.
[platformio]
default_envs = tastiera
src_dir = Keyboard_ESP32C3_Pippaphone

[env:tastiera]
platform = espressif32@6.9.0
board = ttgo-t-oi-plus
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
extra_scripts = post:scrivi_flasher_args.py
